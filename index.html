<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學術寓言</title>
<meta name="description" content="把研究生才學的概念，藏進一則故事裡。讀到最後才恍然大悟。">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#3C3489">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="學術寓言">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#ffffff; --fg:#111111; --muted:#666666; --hint:#9a9a9a;
    --card:#f6f6f4; --line:#e6e6e3; --accent:#3C3489;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000000; --fg:#f0f0f0; --muted:#a8a8ad; --hint:#6e6e73; --card:#141414; --line:#2a2a2a; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--fg);
    font:17px/1.85 -apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;
    -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  #app{ max-width:680px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
  header{ padding:14px 20px 6px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-size:15px; font-weight:600; letter-spacing:.02em; }
  .counter{ font-size:12px; color:var(--hint); }
  .filters{ display:flex; gap:7px; overflow-x:auto; padding:6px 20px 10px; scrollbar-width:none; }
  .filters::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; font-size:13px; padding:6px 13px; border-radius:999px; border:1px solid var(--line);
         color:var(--muted); background:transparent; white-space:nowrap; }
  .chip.on{ color:#fff; border-color:transparent; }
  main{ flex:1; padding:6px 20px 100px; }
  .tag{ font-size:13px; font-weight:600; }
  h1{ font-size:27px; font-weight:700; line-height:1.3; margin:6px 0 18px; }
  .story p{ font-size:18px; margin:0 0 16px; }
  .revealBtn{ display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; margin:10px 0 4px; padding:16px; border:none; border-radius:14px;
    font-size:17px; font-weight:600; color:#fff; }
  .revealHint{ text-align:center; color:var(--hint); font-size:13px; margin:8px 0 0; }
  #reveal{ display:none; }
  .card{ background:var(--card); border-radius:16px; padding:18px 18px 8px; margin-top:10px; }
  .lbl{ font-size:12px; font-weight:600; letter-spacing:.06em; margin-bottom:6px; }
  .concept{ font-size:20px; font-weight:700; margin-bottom:10px; line-height:1.4; }
  .revealText{ font-size:16px; color:var(--muted); margin-bottom:4px; }
  .map{ display:flex; gap:9px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line); }
  .map .s{ flex:1; font-size:15px; }
  .map .a{ font-weight:700; }
  .map .c{ flex:1.15; font-size:15px; color:var(--muted); }
  .punch{ font-size:17px; font-weight:600; line-height:1.7; margin:22px 2px 8px; }
  .bar{ position:sticky; bottom:0; padding:12px 20px calc(14px + env(safe-area-inset-bottom));
        background:linear-gradient(to top, var(--bg) 72%, transparent); }
  .next{ width:100%; padding:16px; border:none; border-radius:14px; font-size:17px; font-weight:600;
         color:#fff; background:var(--accent); }
  .state{ text-align:center; color:var(--hint); padding:60px 20px; font-size:15px; }
  .err{ color:var(--muted); }
  button{ cursor:pointer; font-family:inherit; }
  button:active{ opacity:.7; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">學術寓言</span>
    <span class="counter" id="counter"></span>
  </header>
  <div class="filters" id="filters"></div>
  <main id="main"><div class="state">載入中…</div></main>
  <div class="bar"><button class="next" id="next">抽下一則</button></div>
</div>
<script>
const DATA_URL = "./fables.json";
const DOMAIN_COLOR = {
  "經濟與賽局":"#1D9E75","數學與物理":"#378ADD","生物與演化":"#639922",
  "心理與認知":"#D4537E","資訊與計算":"#7F77DD","哲學與邏輯":"#BA7517"
};
const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let ALL = [], filter = LS.get("filter",""), recent = LS.get("recent",[]), current = null;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function pool(){ return filter ? ALL.filter(f=>f.domain===filter) : ALL; }

function draw(){
  let p = pool();
  let fresh = p.filter(f=>!recent.includes(f.id));
  if(fresh.length===0){ fresh = p; recent = []; }
  current = fresh[Math.floor(Math.random()*fresh.length)];
  recent = [...recent, current.id].slice(-Math.max(1, Math.floor(p.length*0.7)));
  LS.set("recent", recent); LS.set("current", current.id);
  render();
}

function renderFilters(){
  const el = document.getElementById("filters");
  const doms = ["", ...Object.keys(DOMAIN_COLOR)];
  el.innerHTML = "";
  doms.forEach(d=>{
    const b = document.createElement("button");
    b.className = "chip" + (d===filter ? " on":"");
    b.textContent = d || "全部";
    if(d===filter) b.style.background = d ? DOMAIN_COLOR[d] : "#3C3489";
    b.onclick = ()=>{ filter = d; LS.set("filter",d); recent=[]; LS.set("recent",[]); draw(); renderFilters(); };
    el.appendChild(b);
  });
}

function render(){
  const f = current; if(!f) return;
  const hex = DOMAIN_COLOR[f.domain] || "#888780";
  const story = String(f.story).split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join("");
  const maps = (f.mappings||[]).map(m=>
    `<div class="map"><div class="s">${esc(m.story)}</div><div class="a" style="color:${hex}">→</div><div class="c">${esc(m.concept)}</div></div>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="tag" style="color:${hex}">${esc(f.domain)}</div>
    <h1>${esc(f.title)}</h1>
    <div class="story">${story}</div>
    <button class="revealBtn" id="rb" style="background:${hex}">🔓 揭曉這是什麼概念</button>
    <div class="revealHint" id="rh">先想想，再揭曉</div>
    <div id="reveal">
      <div class="card">
        <div class="lbl" style="color:${hex}">這是什麼</div>
        <div class="concept">${esc(f.concept)}</div>
        <div class="revealText">${esc(f.reveal_concept)}</div>
        <div class="lbl" style="color:${hex};margin-top:14px">故事 → 學理</div>
        ${maps}
      </div>
      <div class="punch">${esc(f.punchline)}</div>
    </div>`;
  document.getElementById("rb").onclick = ()=>{
    document.getElementById("reveal").style.display="block";
    document.getElementById("rb").style.display="none";
    document.getElementById("rh").style.display="none";
    document.getElementById("reveal").scrollIntoView({behavior:"smooth", block:"start"});
  };
  document.querySelector(".next").style.background = hex;
  const seen = LS.get("seenCount",0);
  document.getElementById("counter").textContent = `共 ${ALL.length} 則`;
  window.scrollTo({top:0});
}

async function boot(){
  try{
    const res = await fetch(DATA_URL, {cache:"no-cache"});
    const data = await res.json();
    if(data && data.fables && data.fables.length){
      ALL = data.fables; LS.set("cache", data);
    }
  }catch(e){
    const c = LS.get("cache",null);
    if(c && c.fables) ALL = c.fables;
  }
  if(!ALL.length){
    document.getElementById("main").innerHTML = '<div class="state err">讀不到寓言，請連網路後重開一次。</div>';
    return;
  }
  renderFilters();
  draw();
}
document.getElementById("next").onclick = draw;
boot();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
